server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # O Cloudflare Tunnel e o Tailscale já cuidam do HTTPS; aqui é só HTTP interno.
    server_tokens off;
    charset utf-8;

    # Cabeçalhos de segurança básicos.
    # SAMEORIGIN (e não DENY) porque a prévia usa um iframe da própria página.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # O HTML não fica em cache, para os alunos sempre receberem a versão nova.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
