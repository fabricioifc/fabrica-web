services:
  css-grid-lab:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: fabrica-web-dev:local
    container_name: fabrica-web-dev
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ../site:/usr/share/nginx/html:ro
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
